# `configs/dvwa.yaml`
# DVWA is the secondary test target, used to validate the scanner against a PHP application.
# Also compares results against Juice Shop across different architectures.
# Pinned to v1.9 to keep the vulnerability baseline consistent.
target:
  base_url: "http://localhost:8080"
  # Excludes both the logout and setup page so that the scanner cannot reset the database mid-scan.
  excluded_paths:
    - "^/logout.php"
    - "^/setup.php"
# DVWA runs on plain HTTP locally, so SSL verification is not needed.
verify_ssl: false
proxy: null
# 0.05s throttle is fine for a localhost Docker container as it has no real network latency.
throttle_delay: 0.05
scope:
  # Everything runs on the same localhost Docker network and has no subdomains.
  include_subdomains: false
  # Target disallowed paths - possibly the most vulnerable.
  robots_txt: false
login:
  # DVWA uses a standard PHP login form, unlike Juice Shop's REST API endpoint.
  login_url: "http://localhost:8080/login.php"
  login_method: POST
  username_field: "username"
  password_field: "password"
  # DVWA responds with a 302 redirect to /index.php upon success, not a 200.
  success_indicator: "302"
  # Sets DVWA security level to Low after admin login to expose the maximum number of
  # vulnerabilities. Runs once using the admin session immediately after authentication,
  # before any scan module executes.
  post_auth_steps:
    - url: "http://localhost:8080/security.php"
      method: POST
      data:
        security: "low"
        seclev_submit: "Submit"
# DVWA uses PHPSESSID session cookies, not JWT bearer tokens.
# DVWA ships with only the admin account by default.
credentials:
  - username: "admin"
    password: "password"
    role: "admin"
    auth_type: "form"
crawl:
  max_depth: 3
  # Keeping 500 for consistency, though DVWA has far fewer pages than Juice Shop.
  max_pages: 500
  max_crawl_time: 300
  follow_external: false
  # DVWA is server-rendered PHP, meaning the SPA crawler will not find additional endpoints.
  # Playwright is unavailable on this system, and the SPA crawler would crash the scan.
  handle_spa: false
rate_limit:
  # Starting at 10 requests per second and escalating automatically through the tiers.
  requests_per_second: 10
  total_requests: 100
  # Explicitly listed critical endpoints for rate limit detection.
  # `/vulnerabilities/brute/` is included to cover DV-001: no rate limiting on the brute
  # force login module. `/login.php` covers the main DVWA authentication endpoint.
  critical_endpoints:
    - url: "/login.php"
      method: GET
    - url: "/vulnerabilities/brute/"
      method: GET
  # Headers are rotated to test whether DVWA rate limiting checks the IP address.
  bypass_headers:
    - "X-Forwarded-For"
    - "X-Originating-IP"
    - "X-Remote-IP"
    - "X-Client-IP"
    - "X-Real-IP"
  # If no 429 responses are seen at 10 requests per second, escalate automatically through the tiers.
  rate_limit_tiers:
    - { rps: 10,  count: 100 }
    - { rps: 25,  count: 150 }
    - { rps: 50,  count: 200 }
# DVWA has no multi-step purchase sequence. All workflow testing is done against Juice Shop.
workflows: []
# Both formats are generated.
# JSON is used for metric calculations.
# HTML is used for the demonstration video.
reporting:
  output_dir: "reports/"
  format: "both"

# Fixed seed for all random number generators to ensure byte-identical reports across runs.
random_seed: 42