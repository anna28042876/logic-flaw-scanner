# `configs/juiceshop.yaml`
# Juice Shop specific configuration for the logic flaw scanner.
# Pinned to v17.1.1 running on port 3000 inside Docker, on the Kali VM, so that the
# ground truth remains consistent across all scan runs.

target:
  # Root URL thats resolved against all crawled and probed paths, during the scan.
  base_url: "http://localhost:3000"
  # Excludes the logout endpoint so that the scanner cannot invalidate its own sessions mid-scan.
  excluded_paths:
    - "^/rest/user/logout"

# Juice Shop runs over plain HTTP on localhost, so SSL verification unnecessary.
verify_ssl: false
proxy: null
# 0.05s throttle for a localhost Docker container, which has no real network latency.
throttle_delay: 0.05

scope:
  # All targets run on the same localhost Docker network - no subdomains.
  include_subdomains: false
  # Juice Shop's REST API, and all resource endpoints live under these two prefixes.
  allowed_paths:
    - "/api/"
    - "/rest/"
  # Disallowed paths from robots.txt - often the best targets.
  robots_txt: false

login:
  # Juice Shop does not use an HTML login form, credentials are sent as JSON to its REST API.
  login_url: "http://localhost:3000/rest/user/login"
  login_method: POST
  username_field: "email"
  password_field: "password"
  # Successful Juice Shop login returns 200 OK with a `token` field containing the JWT.
  success_indicator: "token"

# All three roles use bearer auth, as Juice Shop issues a JWT on every successful login.
# `admin` is used for vertical privilege escalation testing against admin-only endpoints.
# `user_a`, and `user_b` are used against each other for horizontal IDOR and BOLA testing.
credentials:
  - username: "admin@juice-sh.op"
    password: "CHANGE_ME_ADMIN"
    role: "admin"
    auth_type: "bearer"

  - username: "user_a@test.com"
    password: "CHANGE_ME_USER_A"
    role: "user_a"
    auth_type: "bearer"

  - username: "user_b@test.com"
    password: "CHANGE_ME_USER_B"
    role: "user_b"
    auth_type: "bearer"

crawl:
  # 3 levels to reach all Juice Shop REST endpoints from the root.
  max_depth: 3
  # Raised from 200 - Juice Shop has 60+ endpoints, and would prematurely reach the default limit.
  max_pages: 500
  # Hard 5 minute cutoff, preventing the crawler from hanging if a route does not respond.
  max_crawl_time: 300
  follow_external: false
  # Disabled - Playwright is unavailable on this system, and the SPA crawler would hang the scan.
  handle_spa: false

rate_limit:
  # Starting at 10 requests per second avoids Juice Shop degradation inside the Kali VM.
  requests_per_second: 10
  total_requests: 100
  # Explicitly listed critical endpoints for rate limit detection.
  # `/api/Users` POST is included to cover JS-011: mass account creation rate limiting.
  critical_endpoints:
    - url: "/rest/user/login"
      method: POST
    - url: "/rest/user/reset-password"
      method: POST
    - url: "/rest/user/authentication-details/"
      method: GET
    - url: "/api/Users"
      method: POST
  # Headers rotated to test whether Juice Shop rate limiting is bound to the IP address.
  bypass_headers:
    - "X-Forwarded-For"
    - "X-Originating-IP"
    - "X-Remote-IP"
    - "X-Client-IP"
    - "X-Real-IP"
  # Automatically escalates if no 429 responses are observed at the lower tier.
  rate_limit_tiers:
    - { rps: 10,  count: 100 }
    - { rps: 25,  count: 150 }
    - { rps: 50,  count: 200 }

# Statically declared admin-only endpoints for vertical_auth.py to test regardless of crawl
# differentiation. These endpoints return 200 for admin but must return 401 or 403 for
# non-admin authenticated sessions. Both were missed in the initial scan because all three
# crawl roles discovered them, preventing the `discovered_by_roles == ["admin"]` heuristic
# from flagging them.
known_admin_endpoints:
  - url: "/api/Users"
    method: GET
  - url: "/api/Complaints"
    method: GET

# Add-to-basket then checkout - primary workflow test case for Juice Shop.
# Pre-step resolves the authenticated user's basket ID via GET /rest/user/whoami.
# In Juice Shop v17.1.1, every user's basket ID equals their user ID, so the whoami
# user.id field is used directly as the basket ID for all subsequent workflow steps.
# WorkflowRecorder substitutes all `{{pre.*}}` and `{{token}}` placeholders at runtime.
# Success response: 200 OK with `orderConfirmation` field in the JSON body.
# Failure responses: 401 (no session), 403 (wrong role or basket ownership violation), 400 (malformed body).
workflows:
  - name: "add_to_basket_and_checkout"

    # Pre-steps run before main steps, and extract values needed as placeholders.
    # `GET /rest/user/whoami` returns {"user": {"id": N, ...}} for the authenticated session.
    # `user.id` is used as the basket ID because Juice Shop assigns basket ID == user ID.
    pre_steps:
      - name: "discover_basket_id"
        method: GET
        path: "/rest/user/whoami"
        expected_status: 200
        extract:
          - name: "user_basket_id"
            source: "json"
            path: "user.id"

    steps:
      - name: "add_item_to_basket"
        method: POST
        path: "/api/BasketItems"
        # `{{pre.user_basket_id}}` is substituted at runtime, once the pre-step resolves the basket ID.
        body: '{"ProductId": 1, "BasketId": "{{pre.user_basket_id}}", "quantity": 1}'
        expected_status: 200
        extract:
          - name: "basket_item_id"
            source: "json"
            path: "data.id"

      - name: "checkout"
        method: POST
        path: "/rest/basket/{{pre.user_basket_id}}/checkout"
        # 200 OK with `orderConfirmation` in the body confirms checkout completed successfully.
        expected_status: 200
        extract:
          - name: "order_confirmation"
            source: "json"
            path: "orderConfirmation"

# HTML report possibly used in the live demonstration, JSON is used for recall calculations.
reporting:
  output_dir: "reports/"
  format: "both"

# Fixed seed for all random number generators to ensure byte-identical reports across runs.
random_seed: 42