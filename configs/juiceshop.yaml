# `configs/juiceshop.yaml`
# Juice Shop is the primary test target for IDOR, workflow bypass, and rate-limit testing.
# Pinned to v17.1.1 so that the vulnerability ground truth remains consistent amongst all runs.
target:
  base_url: "http://localhost:3000"
  # Excluding the logout so that the scanner doesnt involuntarily invalidate its own session mid-scan. 
  excluded_paths:
    - "^/rest/user/logout"

# Juice Shop runs over plain HTTP locally so that SSL verification isn't needed.
verify_ssl: false
proxy: null
# 0.05s for localhost docker container - no real network latency.
throttle_delay: 0.05

scope:
  # Everything runs on the same localhost Docker network so there are no subdomains. 
  include_subdomains: false
  # Juice Shop's REST API and resource endpoints all live under these two prefixes. 
  allowed_paths:
    - "/api/"
    - "/rest/"
  # Disallowed paths are what need to be tested - often the most vulnerable.
  robots_txt: false

login:
  # Juice Shop doesn't use an HTML login form, credentials go to its `REST API` as JSON.
  login_url: "http://localhost:3000/rest/user/login"
  login_method: POST
  username_field: "email"
  password_field: "password"
  # A successful login will return a `JSON body` with a `token` field, containing the `JWT`. 
  success_indicator: "token"

# `Admin` is used for vertical privilege escalation testing. 
# `user_a` and `user_b` are used against each other for horizontal IDOR testing.
# Passwords are recorded in `credentials.txt` (excluded from git).
credentials:
  - username: "admin@juice-sh.op"
    password: "CHANGE_ME_ADMIN"
    role: "admin"
    auth_type: "bearer"

  - username: "user_a@test.com"
    password: "CHANGE_ME_USER_A"
    role: "user_a"
    auth_type: "bearer"

  - username: "user_b@test.com"
    password: "CHANGE_ME_USER_B"
    role: "user_b"
    auth_type: "bearer"

crawl:
  # 3 levels should be enough to reach all of Juice Shop's `REST` endpoints from the root. 
  max_depth: 3
  # Raised from 200 because Juice Shop has over 60+ endpoints and hits 200 too early. 
  max_pages: 500
  # 5 minute hard limit to stop the crawler from hanging if something goes awry.
  max_crawl_time: 300
  follow_external: false
  # Juice Shop is an Angular SPA meaning that static crawling wont reveal all the endpoints on its own.
  handle_spa: true

rate_limit:
  # Starting low to avoid Juice Shop degradation within the virtual machine. 
  requests_per_second: 10
  total_requests: 100
  # Headers are rotated to test whether Juice Shop's rate limiting checks the IP.
  bypass_headers:
    - "X-Forwarded-For"
    - "X-Originating-IP"
    - "X-Remote-IP"
    - "X-Client-IP"
    - "X-Real-IP"
  # Only for if there isn't 429 responses at 10 requests per second.
  # If there isn't, then escalate automatically throughout the tiers. 
  rate_limit_tiers:
    - { rps: 10,  count: 100 }
    - { rps: 25,  count: 150 }
    - { rps: 50,  count: 200 }

# Basket --> checkout sequence is the main logic test case for Juice Shop.
workflows:
  - name: "add_to_basket_and_checkout"
    steps:
      - name: "add_item_to_basket"
        method: POST
        path: "/api/BasketItems"
        # {{pre.user_basket_id}} is substituted at runtime once `basket ID` is known.
        body: '{"ProductId": 1, "BasketId": "{{pre.user_basket_id}}", "quantity": 1}'
        expected_status: 200
        extract:
          - name: "basket_item_id"
            source: "json"
            path: "data.id"

      - name: "checkout"
        method: POST
        path: "/rest/basket/{{pre.user_basket_id}}/checkout"
        expected_status: 200
        # The presence of `orderConfirmation` in the response confirms that the checkout succeeded. 
        extract:
          - name: "order_confirmation"
            source: "json"
            path: "orderConfirmation"

# Both formats are generated. 
# HTML for video demonstration.
# JSON for metric calculations.
reporting:
  output_dir: "reports/"
  format: "both"